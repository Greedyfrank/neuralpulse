# Netlify configuration for the NeuralPulse Vite + React app
[build]
  command = "npm run build"
  publish = "dist"

# Serverless backend (Claude API). Requires the ANTHROPIC_API_KEY env var
# to be set in the Netlify UI (Site settings -> Environment variables) or via
# `netlify env:set ANTHROPIC_API_KEY <key>`.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# SPA fallback: serve index.html for client-side routes so deep links / refresh
# don't 404. Netlify serves /.netlify/functions/* before this catch-all.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
